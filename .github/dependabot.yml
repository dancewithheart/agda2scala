# documentation:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "sbt"
    directory: "/scala2"
    schedule:
      interval: "weekly"

  - package-ecosystem: "sbt"
    directory: "/scala3"
    schedule:
      interval: "weekly"
